# Banter server + PostgreSQL + Caddy (blue/green app slots).
# Public API: host 3970 → Caddy → active banter-a or banter-b.
# Deploy health: host 3980 is published only during hot-swap (see scripts/deploy-hot-swap.sh).
#
#   docker compose up -d --build postgres caddy banter-a
#   # or full release path: ./scripts/deploy-hot-swap.sh
#
# The app image defaults to banter-server:local, built from this checkout.
# ghcr.io/snowedinowl/banter:latest is still version-1-test-8. To run that
# published tag: BANTER_IMAGE=ghcr.io/snowedinowl/banter:version-1-test-8
# BANTER_PULL_POLICY=always
#
# Local desktop against Compose Postgres only:
#   docker compose up -d postgres
#
# Point the desktop client at:
#   User Settings → Developer → Remote → 127.0.0.1:3970
#
# Guild voice is UDP. Each app slot publishes its own range (a: 40000-40049,
# b: 40100-40149). BANTER_ADVERTISE_IP is the address written into host ICE
# candidates. 127.0.0.1 is right for a desktop on this machine. A client on
# another machine needs this host's reachable IP, and that UDP range open.

x-banter-app: &banter-app
  build:
    context: .
    pull: true
  image: ${BANTER_IMAGE:-banter-server:local}
  pull_policy: ${BANTER_PULL_POLICY:-build}
  expose:
    - "3970"
  environment:
    BANTER_BIND: "0.0.0.0"
    BANTER_PORT: "3970"
    BANTER_DATA: /data
    BANTER_DATABASE_URL: ${BANTER_DATABASE_URL:-postgres://banter:banter@postgres:5432/banter}
  volumes:
    - banter-data:/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: banter
      POSTGRES_PASSWORD: banter
      POSTGRES_DB: banter
    ports:
      - "${BANTER_PG_PORT:-5432}:5432"
    volumes:
      - banter-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banter -d banter"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${BANTER_PORT:-3970}:3970"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  banter-a:
    <<: *banter-app
    container_name: banter-a
    environment:
      BANTER_BIND: "0.0.0.0"
      BANTER_PORT: "3970"
      BANTER_DATA: /data
      BANTER_DATABASE_URL: ${BANTER_DATABASE_URL:-postgres://banter:banter@postgres:5432/banter}
      BANTER_ADVERTISE_IP: ${BANTER_ADVERTISE_IP:-127.0.0.1}
      BANTER_UDP_MIN: "40000"
      BANTER_UDP_MAX: "40049"
    ports:
      - "40000-40049:40000-40049/udp"

  banter-b:
    <<: *banter-app
    container_name: banter-b
    environment:
      BANTER_BIND: "0.0.0.0"
      BANTER_PORT: "3970"
      BANTER_DATA: /data
      BANTER_DATABASE_URL: ${BANTER_DATABASE_URL:-postgres://banter:banter@postgres:5432/banter}
      BANTER_ADVERTISE_IP: ${BANTER_ADVERTISE_IP:-127.0.0.1}
      BANTER_UDP_MIN: "40100"
      BANTER_UDP_MAX: "40149"
    ports:
      - "40100-40149:40100-40149/udp"

volumes:
  banter-data:
  banter-pg:
  caddy-data:
  caddy-config:
