# Banter server. The desktop app keeps its own default of 127.0.0.1:3970.
# Change the published port with BANTER_PORT. SQLite data stays on the named volume.
#
#   podman compose up --build
#   docker  compose up --build
#
# Point the desktop client at the published port:
#   User Settings → Developer → Remote → 127.0.0.1:3970 (or another host port)

services:
  banter-server:
    build: .
    image: ${BANTER_IMAGE:-ghcr.io/snowedinowl/banter:version-1-test-3}
    ports:
      - "${BANTER_PORT:-3970}:${BANTER_PORT:-3970}"
    environment:
      BANTER_BIND: "0.0.0.0"
      BANTER_PORT: ${BANTER_PORT:-3970}
      BANTER_DATA: /data
    volumes:
      - banter-data:/data
    restart: unless-stopped

volumes:
  banter-data:
