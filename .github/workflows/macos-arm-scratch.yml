# Temporary scratch workflow for cutting Version-1-test-12 macOS arm assets.
# Prefer durable macos-arm-release when workflow_dispatch is allowed; remove after release.
name: macos-arm-scratch

on:
  push:
    branches:
      - "cursor/version-1-test-12-effc"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package Banter.app release
        run: |
          set -euo pipefail
          ./scripts/build-macos-release.sh version-1-test-12 dist/macos
          file dist/macos/Banter.app/Contents/MacOS/banter
          lipo -archs dist/macos/Banter.app/Contents/MacOS/banter
          unzip -l dist/macos/Banter-macos-arm-version-1-test-12.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            dist/macos/Banter-macos-arm-version-1-test-12.zip
            dist/macos/banter-server-macos-arm
