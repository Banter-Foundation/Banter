name: macos-arm

# One-shot Apple Silicon build of the Version-1-test-9 tag. The binaries are
# uploaded to that GitHub pre-release by hand after this job finishes.
on:
  push:
    branches:
      - cursor/macos-arm-test-9-a97f

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Version-1-test-9
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: Release binaries
        run: |
          set -euo pipefail
          cargo build -p banter --release
          cargo build -p banter-server --release
          cp target/release/banter banter-macos-arm
          cp target/release/banter-server banter-server-macos-arm
          codesign --force --sign - banter-macos-arm banter-server-macos-arm
          file banter-macos-arm banter-server-macos-arm
          lipo -archs banter-macos-arm
          lipo -archs banter-server-macos-arm
          zip -j Banter-macos-arm-version-1-test-9.zip banter-macos-arm

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            banter-macos-arm
            banter-server-macos-arm
            Banter-macos-arm-version-1-test-9.zip
