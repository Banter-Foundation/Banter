# Temporary scratch workflow for cutting Version-1-test-N macOS arm64 artifacts.
# Not part of the permanent CI surface; safe to delete after the release.
name: macos-arm

on:
  push:
    branches:
      - "cursor/version-1-test-11-effc"
      - "cursor/macos-arm-*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Release binaries
        run: |
          set -euo pipefail
          cargo build -p banter --release
          cargo build -p banter-server --release
          cp target/release/banter banter-macos-arm
          cp target/release/banter-server banter-server-macos-arm
          codesign --force --sign - banter-macos-arm banter-server-macos-arm
          file banter-macos-arm banter-server-macos-arm
          lipo -archs banter-macos-arm
          lipo -archs banter-server-macos-arm
          zip -j Banter-macos-arm-version-1-test-11.zip banter-macos-arm
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            banter-macos-arm
            banter-server-macos-arm
            Banter-macos-arm-version-1-test-11.zip
