# Temporary scratch workflow for cutting Version-1-test-11.3 macOS arm64 artifacts.
# Not part of the permanent CI surface; safe to delete after the release.
# Packages Banter.app (never a bare Mach-O) via scripts/build-macos-release.sh.
name: macos-arm

on:
  push:
    branches:
      - "cursor/version-1-test-11-3-e1cd"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package Banter.app release
        run: |
          set -euo pipefail
          ./scripts/build-macos-release.sh version-1-test-11.3 dist/macos
          file dist/macos/Banter.app/Contents/MacOS/banter
          lipo -archs dist/macos/Banter.app/Contents/MacOS/banter
          unzip -l dist/macos/Banter-macos-arm-version-1-test-11.3.zip
          ./scripts/check-macos-app-zip.sh dist/macos/Banter-macos-arm-version-1-test-11.3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: |
            dist/macos/Banter-macos-arm-version-1-test-11.3.zip
            dist/macos/banter-server-macos-arm
