name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banter
          POSTGRES_PASSWORD: banter
          POSTGRES_DB: banter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banter -d banter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BANTER_DATABASE_URL: postgres://banter:banter@127.0.0.1:5432/banter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libraries
        # Desktop client pulls GLFW / Wayland / PipeWire / V4L2 via native deps.
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libopus-dev libasound2-dev libx11-dev libxcb1-dev pkg-config
          libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev
          libgl1-mesa-dev libglu1-mesa-dev libglfw3-dev
          libwayland-dev libxkbcommon-dev
          libpipewire-0.3-dev libv4l-dev
      - name: server
        run: cargo test -p banter-server
      - name: client
        run: cargo test -p banter

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: client unit
        run: cargo test -p banter --lib
      - name: server unit
        run: cargo test -p banter-server --lib
