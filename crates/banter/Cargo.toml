[package]
name = "banter"
version = "0.1.0"
edition = "2021"
description = "Banter desktop client. GLFW window, OpenGL, Dear ImGui docking branch."
license = "MIT OR Apache-2.0"

[dependencies]
banter-server = { path = "../banter-server" }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
dear-imgui-glow = "0.22"
dear-imgui-rs = "0.22"
glow = "0.18"
glfw = "0.63"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lewton = "0.10"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
openh264 = "0.9"
opus = "0.4"
resvg = "0.45"
rfd = "0.15"
rtc = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
tungstenite = "0.26"
ureq = { version = "2.12", features = ["json"] }
webrtc = "0.21"
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
pipewire = "0.10"
zbus = "5"

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "implement",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
] }
