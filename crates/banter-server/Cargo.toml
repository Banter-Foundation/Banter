[package]
name = "banter-server"
version = "0.1.0"
edition = "2021"
description = "Local Banter server. Accounts, servers, channels, and messages stay in PostgreSQL after the app closes."
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["limit"] }
async-trait = "0.1"
bytes = "1"
rtc = "0.21"
webrtc = "0.21"
mlua = { version = "0.12.2", features = ["luau", "async", "send", "serialize"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "2.12", features = ["json"] }
